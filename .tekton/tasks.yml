apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up the workspace before starting the pipeline.
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run unit tests using nosetests.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments passed to nosetests.
      type: string
      default: "-v --with-spec --spec-color"
  steps:
    - name: run-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        nosetests $(params.args)
